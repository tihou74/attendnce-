name: Deploy to Firebase Hosting

# ⚠️⚠️ النشرُ من GitHub لا من سطرِ الأوامر — بقصدٍ تامّ.
#   مالكُ المشروع لا يستعمل سطرَ الأوامر، وهذا مكتوبٌ في ملفِّ توجيهِ المشروع
#   منذ بدايته. وشاشةُ Firebase تطلب `firebase login` و`firebase init`، وهما
#   طريقٌ مسدودٌ عنده. فالنشرُ هنا: يضغط «Merge» كما يفعل اليوم، ويُنشر الموقعُ
#   وحدَه في ثوانٍ.
#
# ⚠️ ولا يُنشر إلّا من `main`: فرعٌ قيدَ المراجعةِ لا يجوز أن يصير الموقعَ الحيَّ.

on:
  push:
    branches:
      - main
  # زرٌّ يدويٌّ في تبويب Actions — لإعادةِ النشرِ بلا إيداعٍ جديد.
  workflow_dispatch:

# ⚠️⚠️ أقلُّ صلاحيّةٍ ممكنة: هذا العملُ لا يكتب في المستودع إطلاقًا، فلا يُعطى
#   إلّا القراءة. ولو سُرّب الرمزُ يومًا لا يستطيع تعديلَ سطرٍ واحد.
permissions:
  contents: read

# ⚠️ ولا يتزامن نشرانِ معًا: دمجتانِ متقاربتانِ كانتا تُلغيانِ النشرَ على
#   GitHub Pages فيبقى الموقعُ على نسخةٍ قديمة — وهو عطلٌ أتعبَ المالكَ ثلاثَ
#   مرّاتٍ في يومٍ واحد. هنا يُنتظر الأوّلُ ويُكمَل، ولا يُلغى.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # ⚠️⚠️ حارسٌ قبل النشر: لا يُنشر ملفٌّ لا يُنفَّذ.
      #   سببُه عطلٌ حقيقيٌّ وقع: سطرٌ واحدٌ قرأ ثابتًا قبل تصريحِه فتوقّفت
      #   الوحدةُ عنده، فلم يُسنَد 107 معالجًا — زرُّ الـPDF والموافقاتُ
      #   والإنذارات — بلا أيِّ رسالةٍ على الشاشة. والفحوصُ النصّيّةُ لم ترَه
      #   لأنّ النصَّ كان موجودًا، والمفقودُ أنّ سطرَه يُنفَّذ.
      #   فهنا يُنفَّذ جسمُ كلِّ كتلةٍ كاملًا ببدائلَ شاملة، ويُطلب أن تصل إلى
      #   آخرِ سطرٍ بلا رمي. وإن سقطت، **لا يُنشر شيءٌ** ويبقى الموقعُ الحالي.
      - name: Guard — every inline script must execute to its last line
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs"), vm = require("vm"), MARK = "__REACHED__";
            function stub() {
              const f = function () { return p; };
              const t = Object.assign(f, {
                then: (c) => { try { c && c(p); } catch (e) {} return p; },
                catch: () => p,
                finally: (c) => { try { c && c(); } catch (e) {} return p; }
              });
              const p = new Proxy(t, {
                get(o, k) {
                  if (k === Symbol.toPrimitive) return () => 1;
                  if (k === "then" || k === "catch" || k === "finally") return o[k];
                  if (k === Symbol.iterator) return function* () { yield p; };
                  if (k === "length") return 1;
                  return p;
                },
                set: () => true, has: () => true, apply: () => p, construct: () => p
              });
              return p;
            }
            function run(src) {
              const s = stub();
              // العلامةُ وحدَها تُستثنى من الوكيل، وإلا حُلّت عبره ولم تُكتب أبدًا.
              const scope = new Proxy({}, {
                has: (t, k) => k !== MARK,
                get: (t, k) => (k === Symbol.unscopables ? undefined : s),
                set: () => true
              });
              const code = src
                .replace(/^\s*import\s[^;]*;/gm, "")
                .replace(/^\s*import\s*\{[\s\S]*?\}\s*from\s*["\x27][^"\x27]*["\x27]\s*;?/gm, "");
              try {
                return { ok: !!new Function("__S",
                  "var " + MARK + "=false; with(__S){" + code + "\n;" + MARK + "=true;} return " + MARK + ";")(scope) };
              } catch (e) { return { ok: false, err: e }; }
            }
            // حارسٌ على الحارس: يجب أن يسقطَ على عطلٍ معروفٍ وأن يمرَّ على كودٍ سليم.
            if (run("const A=B*2; const B=5;").ok) { console.error("GUARD SELF-TEST FAILED: missed a known dead zone"); process.exit(2); }
            if (!run("const B=5; const A=B*2; unknown(A).then(x=>x);").ok) { console.error("GUARD SELF-TEST FAILED: rejected clean code"); process.exit(2); }
            console.log("guard self-test OK");

            const pages = fs.readdirSync(".").filter(f => f.endsWith(".html"));
            let blocks = 0, bad = 0;
            for (const file of pages) {
              const html = fs.readFileSync(file, "utf8");
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m;
              while ((m = re.exec(html))) {
                if (/\bsrc\s*=/.test(m[1] || "")) continue;
                const body = m[2];
                if (!body.trim()) continue;
                blocks++;
                const line = html.slice(0, m.index).split("\n").length;
                const stripped = body
                  .replace(/^\s*import\s[^;]*;/gm, "")
                  .replace(/^\s*import\s*\{[\s\S]*?\}\s*from\s*["\x27][^"\x27]*["\x27]\s*;?/gm, "");
                try { new vm.Script(stripped); }
                catch (e) { bad++; console.error("SYNTAX FAIL " + file + " @" + line + ": " + e.message); continue; }
                const r = run(body);
                if (!r.ok) { bad++; console.error("ABORTS " + file + " @" + line + ": " + (r.err && r.err.message)); }
              }
            }
            // حارسٌ يفحص صفرًا يقول «سليم» دائمًا، وهو أخطرُ من غيابِه.
            if (!blocks) { console.error("GUARD SAW ZERO BLOCKS — refusing to deploy"); process.exit(2); }
            console.log("executed " + blocks + " inline block(s) across " + pages.length + " page(s), failures: " + bad);
            process.exit(bad ? 1 : 0);
          '

      # ⚠️ وحارسٌ ثانٍ: زرٌّ ينادي دالّةً لا وجودَ لها ميتٌ **صامتًا** — لا رسالةَ
      #   ولا أثر، ولا يكتشفه إلّا المالكُ بعد أن تُهتزَّ ثقتُه. وقع فعلًا في زرِّ
      #   تصديرِ PDF وبقي شهورًا.
      - name: Guard — every inline on*= handler must resolve to a real function
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const pages = fs.readdirSync(".").filter(f => f.endsWith(".html"));
            const builtin = ["if","for","while","switch","return","typeof","alert","confirm","prompt","function","catch"];
            let missing = 0, checked = 0;
            for (const file of pages) {
              const h = fs.readFileSync(file, "utf8");
              const called = new Set();
              for (const m of h.matchAll(/\son(?:click|change|input|keyup|keydown|submit|scroll|blur|focus)\s*=\s*"([^"]*)"/gi))
                // النداءُ المسبوقُ بنقطةٍ ليس اسمًا عالميًّا: `x(1).then(f)` ليست `then` دالّتَنا.
                for (const c of m[1].matchAll(/(^|[^.\w$])([A-Za-z_$][\w$]*)\s*\(/g)) called.add(c[2]);
              const defined = new Set();
              for (const d of h.matchAll(/(?:window\.([A-Za-z_$][\w$]*)\s*=|function\s+([A-Za-z_$][\w$]*)\s*\(|(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:function|\())/g))
                [d[1], d[2], d[3]].forEach(x => x && defined.add(x));
              for (const c of called) {
                checked++;
                if (!defined.has(c) && !builtin.includes(c)) { missing++; console.error("DEAD HANDLER " + file + ": " + c + "() is called in the markup but never defined"); }
              }
            }
            if (!checked) { console.error("GUARD SAW ZERO HANDLERS — refusing to deploy"); process.exit(2); }
            console.log("checked " + checked + " inline handler call(s), undefined: " + missing);
            process.exit(missing ? 1 : 0);
          '

      # ⚠️ ورقمُ النسخةِ في الصفحةِ يجب أن يساوي رقمَ العاملِ الخِدميّ: الصفحةُ
      #   تقارنهما وتُنبّه المالكَ عند اختلافهما، فنشرُ نسختَين مختلفتَين يُظهر
      #   تحذيرًا كاذبًا بعد كلِّ نشر.
      - name: Guard — APP_BUILD must equal CACHE_VERSION
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const a = (fs.readFileSync("admin.html", "utf8").match(/APP_BUILD = .(v\d+)./) || [])[1];
            const c = (fs.readFileSync("sw.js", "utf8").match(/CACHE_VERSION = .(v\d+)./) || [])[1];
            if (!a || !c) { console.error("could not read the build stamps (APP_BUILD=" + a + ", CACHE_VERSION=" + c + ")"); process.exit(2); }
            console.log("APP_BUILD=" + a + "  CACHE_VERSION=" + c);
            if (a !== c) { console.error("MISMATCH — the page would warn the owner after every deploy"); process.exit(1); }
          '

      # ⚠️⚠️ حارسٌ على اتفاقِ الكودِ مع القواعد: كلُّ قراءةٍ تحتاجها شاشةٌ تدخل
      #   مجهولةً (شاشةُ الموظف، شاشةُ البياعة) يجب أن تكون مسموحةً لها.
      #   سببُه عطلٌ حقيقيٌّ أوقف البيعَ في كلِّ المحلّات: تضييقٌ صحيحٌ في القواعد
      #   (إخفاءُ الرواتبِ عن المجهول) أغلق معه مفتاحَ الخصمِ عن البياعة، وكان
      #   يُقرأ في نفسِ Promise.all مع الكتالوج فأسقطه كلَّه. الحرّاسُ الثلاثةُ
      #   الأخرى كانت تمرُّ كلَّها بينما لا أحدَ يستطيع البيع — لأنّها تقيس الكودَ
      #   وحدَه، وهذا العطلُ يسكن **بين** الكودِ والقواعد.
      - name: Guard — every anonymous-screen read must be allowed by the rules
        run: node .github/scripts/check-kiosk-reads.js .

      # ⚠️⚠️ حارسٌ رابعٌ: المفتاحُ نفسُه يُفحَص قبل محاولةِ النشر.
      #   سببُه عطلٌ حقيقيٌّ وقع: لُصق في السرِّ ملفُّ **صورةٍ** (`<svg xmlns`) بدلَ
      #   نصِّ المفتاح، فقالت أداةُ Firebase: «Failed to authenticate, have you run
      #   firebase login?» — وهي رسالةٌ **كاذبةٌ تمامًا** تدلُّ على طريقٍ مسدودٍ
      #   (المالكُ لا يستعمل سطرَ الأوامر أصلًا)، والسببُ الحقيقيُّ لم يظهر إلّا في
      #   سطرٍ عميقٍ داخلِ سجلِّ التنقيح.
      #   فهنا يُقال السببُ صريحًا: **بأيِّ شيءٍ** أخطأ اللصقُ وما العملُ.
      #
      # ⚠️ ولا يُطبع المفتاحُ ولا جزءٌ منه: تُطبع المعرِّفاتُ غيرُ السرّيّةِ فقط
      #   (رقمُ المشروعِ وبريدُ الحساب، وهما ظاهرانِ في شاشةِ Firebase)، وعند
      #   الفشلِ تُوصَف **هيئةُ** الملصوقِ لا محتواه.
      - name: Guard — the deploy key must be a real service-account key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPECTED_PROJECT: attendance-system-f32d6
        run: |
          node --input-type=commonjs -e '
            // يفحص الهيئةَ ويُرجع سببًا مقروءًا — أو null إن كان المفتاحُ سليمًا.
            function why(raw, expected) {
              if (!raw || !raw.trim()) return "SECRET IS EMPTY — the secret FIREBASE_SERVICE_ACCOUNT is not set, or was saved blank.";
              const t = raw.trim();
              let k;
              try { k = JSON.parse(t); }
              catch (e) {
                if (/^<\s*svg/i.test(t))            return "THIS IS A PICTURE, NOT A KEY — the secret starts with an <svg> drawing. The clipboard held an icon from the web page instead of the text of the downloaded key file.";
                if (/^<\s*(!doctype|html)/i.test(t)) return "THIS IS A WEB PAGE, NOT A KEY — the secret starts with HTML. A page was copied instead of the downloaded key file.";
                if (/^<\s*\?xml/i.test(t))          return "THIS IS AN XML FILE, NOT A KEY — the key file is JSON and must begin with a { character.";
                if (/^-----BEGIN/.test(t))          return "THIS IS ONLY THE PRIVATE-KEY BLOCK — the whole JSON file is needed, not just the -----BEGIN PRIVATE KEY----- part inside it.";
                if (/^(ya29\.|1\/\/)/.test(t))      return "THIS IS AN ACCESS TOKEN, NOT A KEY FILE — tokens expire; the service-account JSON file is required.";
                if (/^[A-Za-z0-9+\/=\s]+$/.test(t) && t.length > 200) return "THIS LOOKS BASE64-ENCODED — paste the key file as plain text, not encoded.";
                return "THIS IS NOT VALID JSON (" + e.message + ") — the key file must be pasted whole, from the opening { to the closing }.";
              }
              if (Array.isArray(k) || k === null || typeof k !== "object") return "THE JSON IS NOT AN OBJECT — the key file is a single { ... } object.";
              if (k.type !== "service_account") return "WRONG KIND OF JSON — a service-account key has \"type\": \"service_account\"; this one has " + JSON.stringify(k.type === undefined ? "(no type field)" : k.type) + ". The google-services / firebaseConfig file is NOT the deploy key.";
              for (const f of ["project_id", "private_key", "client_email"]) {
                if (!k[f]) return "THE KEY IS INCOMPLETE — the field \"" + f + "\" is missing. Download a fresh key and paste the whole file.";
              }
              if (!/BEGIN [A-Z ]*PRIVATE KEY/.test(k.private_key)) return "THE private_key FIELD IS DAMAGED — its BEGIN PRIVATE KEY header is gone, so part of the file was lost while copying.";
              if (k.project_id !== expected) return "KEY BELONGS TO THE WRONG PROJECT — it is for \"" + k.project_id + "\" but this site deploys to \"" + expected + "\".";
              return null;
            }

            // ⚠️ حارسٌ على الحارس: يجب أن يسقطَ على كلِّ خطأٍ معروفٍ وأن يمرَّ على
            //   مفتاحٍ سليمِ الهيئة. حارسٌ لا يُجرَّب قد يقول «سليم» دائمًا.
            const P = "attendance-system-f32d6";
            const good = JSON.stringify({ type: "service_account", project_id: P, private_key: "-----BEGIN PRIVATE KEY-----\nAAA\n-----END PRIVATE KEY-----\n", client_email: "x@" + P + ".iam.gserviceaccount.com" });
            const bad = [
              ["", /EMPTY/], ["   ", /EMPTY/],
              ["<svg xmlns=\"http://www.w3.org/2000/svg\"></svg>", /PICTURE/],
              ["<!doctype html><html></html>", /WEB PAGE/],
              ["<?xml version=\"1.0\"?><a/>", /XML/],
              ["-----BEGIN PRIVATE KEY-----\nAAA\n-----END PRIVATE KEY-----", /ONLY THE PRIVATE-KEY BLOCK/],
              ["ya29.a0AfB_byC", /ACCESS TOKEN/],
              ["{ not json", /NOT VALID JSON/],
              ["[1,2,3]", /NOT AN OBJECT/],
              [JSON.stringify({ project_info: { project_id: P } }), /WRONG KIND OF JSON/],
              [JSON.stringify({ type: "service_account", project_id: P, client_email: "a@b.c" }), /"private_key" is missing/],
              [JSON.stringify({ type: "service_account", project_id: P, private_key: "AAA", client_email: "a@b.c" }), /private_key FIELD IS DAMAGED/],
              [good.replace(P, "some-other-project"), /WRONG PROJECT/]
            ];
            let selfFails = 0;
            for (const [sample, expect] of bad) {
              const r = why(sample, P);
              if (!r) { console.error("GUARD SELF-TEST FAILED: accepted a bad key matching " + expect); selfFails++; }
              else if (!expect.test(r)) { console.error("GUARD SELF-TEST FAILED: wrong reason for " + expect + " -> " + r); selfFails++; }
            }
            if (why(good, P)) { console.error("GUARD SELF-TEST FAILED: rejected a well-formed key -> " + why(good, P)); selfFails++; }
            if (!bad.length) { console.error("GUARD SELF-TEST SAW ZERO SAMPLES"); process.exit(2); }
            if (selfFails) process.exit(2);
            console.log("guard self-test OK (" + (bad.length + 1) + " samples)");

            const reason = why(process.env.SA_KEY, process.env.EXPECTED_PROJECT);
            if (reason) {
              console.error("");
              console.error("================ THE DEPLOY KEY IS NOT USABLE ================");
              console.error(reason);
              console.error("");
              console.error("HOW TO FIX IT (no command line needed):");
              console.error("  1. Firebase Console -> the gear icon -> Project settings");
              console.error("  2. Open the \"Service accounts\" tab");
              console.error("  3. Press \"Generate new private key\" -> a .json file downloads");
              console.error("  4. Drag that .json file into a new browser tab, then Ctrl+A and Ctrl+C");
              console.error("  5. GitHub -> Settings -> Secrets and variables -> Actions");
              console.error("     -> FIREBASE_SERVICE_ACCOUNT -> Update -> paste -> Save");
              console.error("  6. Back in the Actions tab, press \"Re-run jobs\"");
              console.error("");
              console.error("Nothing was published. The live site is untouched and still working.");
              console.error("=============================================================");
              process.exit(1);
            }
            const k = JSON.parse(process.env.SA_KEY);
            console.log("deploy key OK — project: " + k.project_id + ", account: " + k.client_email);
          '

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: attendance-system-f32d6
          channelId: live
