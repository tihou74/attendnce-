<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Report — Al Sheikha Group</title>

<!-- =============================================================================
     مدخل المديرين النظيف
     -----------------------------------------------------------------------------
     لماذا ملف جديد بهذا الاسم؟

     كان تثبيت تطبيق المديرين يفشل على iPhone لأن iOS يحفظ **رابط الصفحة
     الظاهرة** عند «إضافة إلى الشاشة الرئيسية» و**يُسقط منه الـquery**. فأي
     أيقونة تُنشأ من `index.html?report=1` تُحفظ كـ `index.html` — أي شاشة
     الموظفين. وأربع محاولات إصلاح على ملفات التعريف (manifest) لم تُجدِ، لأن
     ملف التعريف لا يملك تغيير أيقونة بناها النظام من الرابط الظاهر.

     الحل هنا لا يعتمد على الـquery إطلاقًا:
       • المسار نفسه `manager.html` هو العلامة، وليس فيه شيء يُسقَط.
       • يُسجّل الوضع في localStorage قبل الانتقال، فحتى لو فُتح `index.html`
         عاريًا في المرة القادمة عرف أنه تطبيق المديرين.
       • اسم ملف جديد لم يُخزَّن في أي كاش سابق، فلا تصل إليه نسخة قديمة.

     ⚠️ لا تُسجّل هذه الصفحة Service Worker، حتى تبقى دائمًا من الشبكة.
     ============================================================================= -->

<link rel="manifest" href="./manifest-report.json">
<meta name="theme-color" content="#0B1226">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/report-192.png">
<link rel="apple-touch-icon" href="./icons/report-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sales Report">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./brand/design-tokens.css">

<style>
    /* =========================================================================
       شاشة دخول المديرين — الهوية على سطح داكن.
       هنا يتحرّر الذهب: على الكحلي تباينه 8.63:1، فيصير لون العنوان والزر —
       وهو ما لا يجوز على الأبيض حيث تباينه 3.08:1 فقط.

       ⚠️ كل var() هنا لها قيمة احتياطية بعدها. هذه الصفحة **لا تُسجّل Service
       Worker** عن قصد (انظر التحذير أعلى الملف) فتُجلب من الشبكة دائمًا؛ ولو
       تعذّر تحميل ورقة الهوية لأي سبب وجب أن تبقى الشاشة مقروءة لا بيضاء
       فارغة — فهي الطريق الوحيد للمدير إلى شاشته.
       ========================================================================= */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
        font-family: var(--font-sans, 'Segoe UI', Tahoma, sans-serif);
        background: var(--ink-900, #0B1226);
        color: #E8EDF6;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        padding: var(--space-8, 32px) var(--space-5, 20px) calc(var(--space-8, 32px) + env(safe-area-inset-bottom));
        padding-top: calc(var(--space-8, 32px) + env(safe-area-inset-top));
    }
    .card { width: 100%; max-width: 380px; }
    img.logo {
        width: 84px; height: 84px; border-radius: var(--radius-lg, 10px);
        display: block; margin: 0 auto var(--space-5, 20px);
    }
    h1 {
        font-size: var(--text-xl, 22px); font-weight: 700; margin: 0 0 6px;
        letter-spacing: -.01em; color: var(--gold-400, #CAAD73);
    }
    .sub {
        font-size: var(--text-xs, 12px); color: #9FB0CA; margin: 0 0 var(--space-6, 24px);
        line-height: 1.7; text-transform: uppercase; letter-spacing: .14em; font-weight: 600;
    }
    /* الزر ذهبي بنصّ كحلي — الاتجاه الوحيد الذي يمرّ التباين مع الذهب */
    a.btn {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 48px; padding: 0 var(--space-6, 24px);
        background: var(--gold-600, #A89060); color: var(--ink-800, #0F172A);
        text-decoration: none; border-radius: var(--radius-md, 6px);
        font-size: var(--text-base, 16px); font-weight: 700;
        transition: background var(--dur-fast, 120ms) var(--ease, ease);
    }
    a.btn:hover { background: var(--gold-500, #B99E6A); }
    a.btn:focus-visible { outline: 2px solid var(--gold-300, #DABB7D); outline-offset: 3px; }
    a.btn:active { transform: scale(0.985); }
    .install {
        margin-top: var(--space-8, 32px); background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-inline-start: 3px solid var(--gold-600, #A89060);
        border-radius: var(--radius-md, 6px);
        padding: var(--space-4, 16px) var(--space-5, 20px); text-align: start;
    }
    .install h2 {
        font-size: var(--text-sm, 13.5px); margin: 0 0 var(--space-3, 12px);
        color: var(--gold-400, #CAAD73); font-weight: 700;
    }
    .install ol {
        margin: 0; padding-inline-start: 20px; font-size: var(--text-sm, 13.5px);
        color: #C7D2E4; line-height: 1.9;
    }
    .note { font-size: var(--text-xs, 12px); color: #8B99B3; margin: var(--space-3, 12px) 0 0; line-height: 1.7; }
</style>
</head>
<body>

<div class="card">
    <img class="logo" src="./icons/report-192.png" alt="Sales Report">
    <h1>Sales Report</h1>
    <p class="sub">Managers only &mdash; Al Sheikha Group</p>

    <a class="btn" id="goBtn" href="./index.html?report=1">Open &#10132;</a>

    <div class="install" id="installBox">
        <h2>Add to your home screen</h2>
        <ol id="steps"></ol>
        <p class="note">Install from <b>this</b> page. An icon made from any other page can open the staff screen instead.</p>
    </div>
</div>

<script>
    // نُسجّل الوضع فورًا: هذه هي الشبكة الأمان الحقيقية. حتى لو أسقط النظام
    // الـquery في أي فتح لاحق، عرف index.html أنه تطبيق المديرين.
    try { localStorage.setItem('alsheikha_pwa_mode', 'report'); } catch (e) { /* وضع خاص */ }

    function isStandalone() {
        if (navigator.standalone === true) return true;
        try {
            return window.matchMedia('(display-mode: standalone)').matches ||
                   window.matchMedia('(display-mode: fullscreen)').matches ||
                   window.matchMedia('(display-mode: minimal-ui)').matches;
        } catch (e) { return false; }
    }

    if (isStandalone()) {
        // تطبيق مثبَّت: لا تعليمات ولا نقرة إضافية.
        document.getElementById('installBox').style.display = 'none';
        location.replace('./index.html?report=1');
    } else {
        var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var steps = isIOS
            ? ['Tap the Share button at the bottom of Safari.',
               'Scroll down and tap <b>Add to Home Screen</b>.',
               'Tap <b>Add</b>.']
            : ['Open the browser menu (\u22EE).',
               'Tap <b>Add to Home screen</b> or <b>Install app</b>.',
               'Confirm.'];
        document.getElementById('steps').innerHTML =
            steps.map(function (s) { return '<li>' + s + '</li>'; }).join('');
    }
</script>

</body>
</html>
