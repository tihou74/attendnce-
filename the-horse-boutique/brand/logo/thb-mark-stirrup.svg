<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img"
     aria-labelledby="t d" fill="none">
  <title id="t">The Horse Boutique — primary mark</title>
  <desc id="d">An English stirrup iron enclosing the letter H.</desc>

  <!-- ===== STIRRUP IRON =====================================================
       Symmetric about x=120. Pure path geometry: no font dependency, no
       raster, identical at 16px and on a 3-metre storefront.
       Stroke weight is deliberately fine — luxury reads thin, not chunky.
       ==================================================================== -->
  <g stroke="currentColor" stroke-width="11" stroke-linecap="round"
     stroke-linejoin="round">
    <!-- Eye: the slot the stirrup leather passes through -->
    <path d="M107 61 V43 H133 V61" />
    <!-- Body: near-vertical branches, flattened crown — an iron, not a bell -->
    <path d="M58 184 C56 132 64 61 120 61 C176 61 184 132 182 184" />
    <!-- Tread: the flat footplate -->
    <path d="M47 186 H193" />
  </g>

  <!-- ===== MONOGRAM =========================================================
       "H" for HORSE. The stems are heavier than the crossbar, echoing the
       thick/thin modulation of the Cormorant Garamond wordmark.
       ==================================================================== -->
  <g stroke="currentColor" stroke-linecap="butt">
    <path d="M96 101 V159" stroke-width="10" />
    <path d="M144 101 V159" stroke-width="10" />
    <path d="M96 130 H144" stroke-width="5.5" />
  </g>
</svg>
